name: CI — AXIOMA pytest

on:
  push:
    branches: [main]
    # ✅ 2026-10-12: un tag `v*` es un release. Los tres jobs de siempre corren igual (validan el
    # release) y además se dispara la publicación de la imagen en GHCR (job `publicar-imagen`).
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ✅ 2026-10-07: UNA sola versión, la que se usa de verdad (**3.14**). Antes había una matriz de
    # transición (3.12 + 3.14, con `continue-on-error` en 3.14 para comparar sin rojo falso).
    # Decisión del usuario: la imagen también pasa a 3.14, así que probar 3.12 era cuidar un entorno
    # que ya no existe. Si 3.14 falla, el CI tiene que ponerse ROJO.
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v4

      # ✅ v0.7.3: `@v5` → `@v6`. Las versiones viejas del action resuelven contra
      # un manifiesto de Pythons que puede no incluir 3.14 (v7.0.0 es la última).
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # v0.6.9k: requirements.txt fija torch==2.11.0+cpu + torchaudio==2.11.0
      # (PyPI depende de torch sin +cpu) → conflicto de resolución en CI.
      # Torch/torchaudio se instalan del index CPU por separado, y el resto de
      # deps desde requirements-ci.txt (sin las 3 líneas conflictivas).
      # ⚠️ 2026-10-28 (MEDIDO): el pin de torch tiene que coincidir con `requirements.txt`.
      # Con torch 2.11.0+cpu y `setuptools==84.2.1` en requirements-ci, pip veía un conflicto
      # (torch 2.11 declara `setuptools<82`) y RESOLVÍA torch 2.15.0 de PyPI, que en Linux arrastra
      # CUDA: 2,5 GB de wheels `nvidia-*` + triton de 285 MB ⇒ el job murió por red a mitad de
      # descarga. Con torch 2.14.1+cpu (el de requirements.txt) satisface `silero-vad` y no baja nada.
      - name: Instalar torch (index CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchaudio==2.11.0+cpu

      - name: Instalar resto de dependencias
        run: |
          pip install -r requirements-ci.txt

      # sentence-transformers después de torch (su dep torch ya está satisfecha)
      - name: Instalar sentence-transformers
        run: |
          pip install sentence-transformers==5.4.1

      # v0.6.9n: libs de sistema que los tests necesitan (audio/multimodal):
      # sounddevice requiere PortAudio (no trae la lib) y soundfile libsndfile.
      - name: Instalar librerías de sistema (audio)
        # ✅ 2026-10-07: medido — un `apt-get` colgado hizo que GitHub CANCELARA el trabajo entero; el
        # paso prometía tolerar fallas, pero sólo toleraba que el comando devolviera error, no que se
        # quedara colgado. Con el límite de tiempo y `continue-on-error`, el peor caso es quedarse sin
        # las librerías de audio: los módulos de voz se importan igual (guarda `(ImportError, OSError)`
        # en sounddevice) y los tests que necesitan audio se saltean solos, nunca perder la corrida.
        timeout-minutes: 5
        continue-on-error: true
        # ✅ ISSUE-149: si el espejo de paquetes falla (pasa seguido), este paso tumbaba TODOS los
        # siguientes y el error visible era un FileNotFoundError del portero. Ahora avisa y sigue:
        # sin las libs de audio se saltean los 2 tests que las usan (no se degradan: se saltan).
        # Verificado simulando PortAudio ausente (sounddevice falso por PYTHONPATH): 24/24 archivos,
        # 2 saltados (test_axioma_28 y test_axioma_30), exit 0. Antes de la guarda `OSError` era
        # FALSO: el import de los 6 módulos de voz reventaba y test_audio_diagnostic ni se colectaba.
        run: |
          sudo apt-get update || echo "::warning::apt-get update falló; sigo sin las libs de audio"
          sudo apt-get install -y libportaudio2 libsndfile1 portaudio19-dev \
            || echo "::warning::no se pudieron instalar las librerías de audio; los tests de voz se saltean"

      # Cache del modelo de embeddings para no descargarlo en cada run.
      # ✅ 2026-10-28: la clave lleva el MODELO (no sólo OS+Python). Antes era
      # `hf-<os>-py<ver>` y seguía restaurando la caché vieja de `bge-m3` (2,5 GB,
      # 4,3 GB descomprimido): desde el cambio a `codefuse-ai/F2LLM-v2-330M` (638 MB)
      # era peso muerto y el `tar` de la restauración fallaba en el runner
      # ("Wrote only 9216 of 10240 bytes" = se quedó sin espacio). Con el modelo en la
      # clave, la caché vieja NO se restaura y expira sola (7 días sin uso).
      # ⚠️ Si se vuelve a cambiar el modelo de embeddings, cambiar `f2llm-v2-330m`.
      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-py${{ matrix.python-version }}-f2llm-v2-330m
          restore-keys: |
            hf-${{ runner.os }}-py${{ matrix.python-version }}-f2llm-v2-330m

      # ✅ v0.6.9v (P0 del informe): el `.env` no está en el repo (gitignored) y
      # algunos detectores del auditor comparan `.env` vs `.env.example`
      # (`env_models`). Sin este paso la auditoría mediría el entorno, no el
      # código, y el gate podría bloquear por un motivo falso.
      # ✅ v0.7.3 (ISSUE-089): además se crean `logs/` **y `docs/`**. Las dos
      # carpetas existen en cualquier copia de trabajo real pero NO se versionan a
      # propósito (`ISSUE-072`: son runtime/internas), así que un checkout limpio
      # no las tiene y los tests de estructura del proyecto fallaban en CI (el
      # gate cuenta cada archivo con `Veredicto: ✅ TODO CORRECTO`).
      - name: Preparar .env y carpetas de runtime (logs/, docs/)
        # ✅ ISSUE-149: `if: always()` para que `logs/` exista aunque un paso anterior falle. Sin
        # esto, el portero (que corre con `if: always()`) se caía con FileNotFoundError al escribir
        # `logs/gate.json` y el error real quedaba escondido.
        if: always()
        run: |
          mkdir -p logs docs
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi

      # ✅ v0.6.9v: auditoría ANTES de los tests → deja `logs/audit_summary.json`
      # (resumen máquina-legible: SCORE, severidades, desglose y detectores).
      - name: Auditoría (resumen JSON)
        env:
          CI: 'true'
        run: |
          mkdir -p logs
          python axioma_auditor.py --format json -o logs/audit_summary.json

      # ✅ v0.6.9v: se reemplazó `pytest tests/` por el runner del proyecto.
      # Ejecuta cada archivo por separado y escribe el reporte CONSOLIDADO con
      # `run_id`, `pytest exitstatus` REAL por archivo y tests recolectados —
      # que es exactamente lo que el gate necesita como evidencia.
      - name: Suite de tests (reporte consolidado)
        env:
          CI: 'true'
          # Sin Ollama en CI: algunos tests se saltan o degradan solos
          OLLAMA_HOST: 'http://127.0.0.1:1'
        run: |
          python tools/run_all_tests.py --timeout 150

      # ✅ v0.6.9v: gate de calidad (SCORE, severidades, detectores protegidos,
      # exitstatus real, run_id y frescura del health report).
      # `--no-require-health`: en CI no hay logs de runtime, así que la frescura
      # se SALTA (no se finge): localmente sí se exige.
      # ✅ 2026-10-07: cuando la suite falla en el CI, el detalle vive en un artefacto que necesita
      # credenciales para bajarse: desde afuera no se puede saber QUÉ prueba falló. Este paso convierte
      # los fallos en ANOTACIONES (`::error::`), que GitHub publica y que se leen por la API pública.
      - name: Anotar qué falló (para poder verlo sin bajar artefactos)
        if: failure()
        shell: bash
        run: |
          ultimo=$(ls -t logs/axioma_test_report_batch_*.md 2>/dev/null | head -1 || true)
          if [ -z "$ultimo" ]; then
            echo "::error::no hay reporte consolidado: la suite no llegó a correr"
            exit 0
          fi
          echo "::error::reporte: $ultimo"
          grep -E "^- FAIL:" "$ultimo" | head -5 | sed 's/^/::error::/' || true
          grep -E "^\s*\|.*❌" "$ultimo" | head -8 | sed 's/^/::error::/' || true

      - name: Quality gate
        if: always()
        env:
          CI: 'true'
          OLLAMA_HOST: 'http://127.0.0.1:1'
        run: |
          python tools/log_health_report.py || true
          python tools/quality_gate.py --no-require-health --json logs/gate.json

      # ✅ v0.7.4 (ISSUE-091): el reporte y el gate se suben como artefacto. Sin
      # esto, cuando el gate bloquea por "17/18 archivos" NO hay forma de saber
      # cuál falló desde la consola (el detalle vive en este .md, que se pierde
      # con el runner). El gate además imprime los archivos con checks ❌.
      - name: Subir reportes (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-py${{ matrix.python-version }}
          path: |
            logs/axioma_test_report_batch_*.md
            logs/gate.json
            logs/audit_summary.json
          if-no-files-found: warn
          retention-days: 14


  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # INSTALADORES DE WINDOWS — se prueban en un Windows REAL (runner `windows-latest`).
  # Por qué existe: en el equipo del autor no hay Windows (`command -v pwsh` no devuelve nada), así que
  # los guiones de Windows sólo tenían pruebas de ESTRUCTURA (leer el archivo y comparar texto). Acá se
  # EJECUTAN, y con los dos PowerShell que puede tener un usuario: el 5.1 que trae Windows y el 7.
  #   · Sin BOM, PowerShell 5.1 lee el archivo como ANSI y los acentos salen mal
  #   · En PowerShell 7.4+ un comando que falla LANZA excepción (por eso los guiones protegen los
  #     llamados a Docker; acá se ve si la protección alcanza)
  #   · Sin Docker, el guion tiene que explicar en castellano qué falta y salir con 4 (no quedarse mudo)
  # Lo que NO cubre (necesita una PC con Windows y Docker Desktop, a mano): armar la imagen de verdad,
  # crear los accesos directos del menú Inicio y del Escritorio, llegar al Ollama del equipo y abrir el
  # navegador. Está anotado en DECISIONES.md (D-10).
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # ⚠️ MEDIDO el 2026-10-06: la primera versión de este trabajo usaba una matriz y
  # `shell: ${{ matrix.shell }}`. GitHub NO acepta una expresión ahí: el workflow entero no validó, la
  # corrida quedó ROJA y SIN NINGÚN trabajo (`total_count: 0`, y la corrida se llamaba por el archivo
  # `.github/workflows/ci.yml` en vez de por su nombre). Se usan dos pasos con `shell` literal.
  instaladores-windows:
    name: instaladores de Windows (PowerShell 5.1 y 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 5.1 (el que trae Windows)
        shell: powershell
        run: |
          & .\tests\probar_instaladores_windows.ps1
          $codigo = $LASTEXITCODE
          Write-Host "codigo del comprobador: $codigo"
          exit $codigo

      - name: El demonio de voz encuentra el endpoint (con un AXIOMA de mentira)
        shell: pwsh
        run: |
          # En el runner no hay AXIOMA, así que se levanta uno FALSO (servidor mínimo de la biblioteca
          # estándar) y el demonio tiene que encontrarle el endpoint de chat e informarlo. Es la parte que
          # no se puede probar sin Windows: la elección de la ruta y el pedido real.
          $falso = Start-Process python -ArgumentList "tests/axioma_falso_http.py", "8098" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          try {
            & .\instalar\rafael_windows.ps1 -Ensayo -Url http://127.0.0.1:8098
            $codigo = $LASTEXITCODE
          } finally {
            Stop-Process -Id $falso.Id -Force -ErrorAction SilentlyContinue
          }
          if ($codigo -ne 0) {
            Write-Host "::error::el demonio de voz no encontró el AXIOMA falso (salida $codigo)"
            exit 1
          }
          Write-Host "OK: el demonio de voz encontró el endpoint y avisó"

      - name: Anotar qué falló (si falló)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "::error::el comprobador de los instaladores de Windows falló: mirá el paso anterior"

      - name: PowerShell 7
        shell: pwsh
        run: |
          & .\tests\probar_instaladores_windows.ps1
          $codigo = $LASTEXITCODE
          Write-Host "codigo del comprobador: $codigo"
          exit $codigo

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # INSTALADORES DE LINUX — ejecutados de verdad, en un Linux real.
  # Los guiones de Linux se prueban igual que los de Windows: se EJECUTAN. En modo ensayo no tocan
  # nada, pero el camino que recorren es el real (comprobar Docker, decidir entre el Ollama del equipo
  # y el propio, armar el plan y decir a qué dirección abriría el navegador).
  # Lo que NO cubre (necesita una máquina propia, a mano): armar la imagen de verdad (son minutos y
  # GB), crear el acceso directo del menú, y que el navegador se abra con la pantalla de configuración.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  instaladores-linux:
    name: instaladores de Linux (ejecutados de verdad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensayo del instalador y del lanzador
        shell: bash
        run: |
          # ⚠️ GitHub ejecuta los pasos de `bash` con `-e`: un comando que devuelve distinto de 0 CORTA
          # el paso entero. Medido el 2026-10-06: la comprobación del interruptor inexistente (que sale
          # con 2, y está bien que salga así) mataba el trabajo antes de poder mirar el código, y el
          # fallo aparecía sin ningún mensaje. Acá los códigos se miran A MANO: por eso `set +e`.
          set +e
          fallo=0
          echo "docker: $(command -v docker || echo NO HAY) · compose: $(docker compose version 2>/dev/null | head -1 || echo NO HAY)"

          echo "▶ instalar_axioma.sh --dry-run"
          salida=$(bash instalar/instalar_axioma.sh --dry-run 2>&1); codigo=$?
          echo "$salida"
          echo "   (código de salida: $codigo)"
          case "$codigo" in
            0)
              grep -q "docker compose build" <<<"$salida" \
                || { echo "❌ el instalador no muestra que armaría la imagen"; fallo=1; }
              ;;
            4)
              grep -qi "docker" <<<"$salida" \
                || { echo "❌ salió 4 y no explica que falta Docker"; fallo=1; }
              echo "   (el runner no tenía Docker: se comprobó el camino de «falta Docker»)"
              ;;
            *) echo "❌ código inesperado: $codigo"; fallo=1 ;;
          esac

          echo "▶ iniciar_axioma.sh --dry-run"
          salida=$(bash instalar/iniciar_axioma.sh --dry-run 2>&1); codigo=$?
          echo "$salida"
          echo "   (código de salida: $codigo)"
          case "$codigo" in
            0)
              grep -q "docker compose" <<<"$salida" \
                || { echo "❌ el lanzador no muestra que encendería AXIOMA"; fallo=1; }
              grep -q "abriría http://127.0.0.1:8080" <<<"$salida" \
                || { echo "❌ el lanzador no dice a qué dirección abriría el navegador"; fallo=1; }
              # Tiene que haber decidido entre el Ollama del equipo y el propio, y decirlo.
              grep -qE "Ya tenés Ollama|Levanto el Ollama" <<<"$salida" \
                || { echo "❌ no decidió qué Ollama usar"; fallo=1; }
              ;;
            4)
              grep -qi "docker" <<<"$salida" \
                || { echo "❌ salió 4 y no explica que falta Docker"; fallo=1; }
              echo "   (el runner no tenía Docker: se comprobó el camino de «falta Docker»)"
              ;;
            *) echo "❌ código inesperado: $codigo"; fallo=1 ;;
          esac

          echo "▶ un interruptor que no existe tiene que ser rechazado"
          salida=$(bash instalar/iniciar_axioma.sh --no-existe 2>&1); codigo=$?
          echo "$salida"
          [ "$codigo" -eq 2 ] || { echo "❌ aceptó un interruptor que no existe (salió $codigo, se esperaba 2)"; fallo=1; }

          echo "▶ si Docker falla al encender, tiene que EXPLICARLO (no morir con el error crudo)"
          # Se le pone un `docker` falso adelante en el PATH: contesta bien a `info` y falla en
          # `compose up`, como cuando ya hay otro AXIOMA andando. Es una prueba real del camino de
          # error, sin tocar ningún contenedor.
          falso=$(mktemp -d)
          printf '#!/bin/sh\ncase "$*" in\n  "info"*) exit 0 ;;\n  *compose*up*) echo "Conflict. The container name /axioma is already in use" >&2; exit 1 ;;\n  *) exit 0 ;;\nesac\n' > "$falso/docker"
          chmod +x "$falso/docker"
          salida=$(PATH="$falso:$PATH" bash instalar/iniciar_axioma.sh 2>&1); codigo=$?
          echo "$salida"
          if [ "$codigo" -eq 4 ] && grep -q "Docker no pudo encender AXIOMA" <<<"$salida"; then
            echo "   ✅ falla con 4 y dice qué mirar"
          else
            echo "❌ se esperaba código 4 con la explicación (salió $codigo)"; fallo=1
          fi
          rm -rf "$falso"

          echo "▶ el instalador de UN SOLO ARCHIVO del Release también arranca"
          # `AXIOMA_REPO` porque en el repositorio el instalador es la PLANTILLA (lleva `__REPO__` en
          # vez del repositorio: lo que se distribuye no lleva la identidad del autor).
          if AXIOMA_REPO=ejemplo/proyecto bash instalar/axioma-instalar.sh --dry-run >/dev/null 2>&1; then
            echo "   ✅ axioma-instalar.sh --dry-run sale 0"
          else
            echo "❌ axioma-instalar.sh --dry-run no salió 0"; fallo=1
          fi

          if [ "$fallo" -eq 0 ]; then
            echo "✅ los instaladores de Linux arrancan y explican lo que harían"
          fi
          exit $fallo

  # ── Publicar la imagen del contenedor en GHCR ────────────────────────────────────────────────
  # Se dispara SOLO al etiquetar (`git tag v0.7.5 && git push origin v0.7.5`) y SOLO desde el
  # repositorio PÚBLICO: un paquete publicado desde un repositorio privado **nace privado**, y
  # entonces el instalador de un usuario cualquiera no podría bajarlo sin credenciales.
  #
  # Por qué publica acá y no con un script suelto: el propio proyecto exige que **una imagen que no
  # pasa sus pruebas no se publique**. `tools/verificar_imagen.sh` compila, MIDE el tamaño y corre
  # la suite ADENTRO de la imagen; si eso falla, el job se corta y no se sube nada.
  publicar-imagen:
    name: publicar imagen en GHCR
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verificar la imagen (compila, mide el tamaño y corre la suite adentro)
        run: bash tools/verificar_imagen.sh

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar y subir
        run: |
          set -euo pipefail
          # GHCR sólo acepta nombres en minúsculas: `${VAR,,}` es la minúscula de bash.
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag axioma:local "$IMAGEN:${GITHUB_REF_NAME}"
          docker tag axioma:local "$IMAGEN:latest"
          docker push "$IMAGEN:${GITHUB_REF_NAME}"
          docker push "$IMAGEN:latest"
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "$IMAGEN:${GITHUB_REF_NAME}"
            echo "$IMAGEN:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recordar revisar la visibilidad del paquete
        run: |
          echo "⚠️  Si es la PRIMERA publicación, revisá que el paquete haya quedado PÚBLICO:"
          echo "    https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY##*/}"
          echo "    (Package settings → Change visibility → Public). Si queda privado, el instalador"
          echo "    no puede bajarlo sin credenciales y la instalación falla en el primer paso."

  # ── Instaladores de un solo archivo, como assets del Release ─────────────────────────────────
  # El usuario final descarga **un archivo** y lo ejecuta: no clona nada ni necesita Python.
  #   · `AXIOMA-Setup.exe`   → Windows, doble clic (PyInstaller envuelve `instalar/axioma_setup.py`)
  #   · `axioma-instalar.sh` → Linux, un archivo (`bash axioma-instalar.sh`)
  # Se construye en Windows porque PyInstaller **no compila cruzado** desde Linux.
  instaladores-release:
    name: instaladores de un solo archivo (Release)
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Fija la versión del tag Y el repositorio en los DOS instaladores: el que se baja un release
      # instala ESE release, y el código no lleva la identidad del autor (regla del proyecto, con
      # guardián en `test_axioma_28`). Si algún `sed` no engancha, el job FALLA en vez de publicar en
      # silencio un instalador que baja otra cosa.
      - name: Fijar la versión del tag y el repositorio
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|^VERSION=\"\${AXIOMA_VERSION:-main}\"|VERSION=\"\${AXIOMA_VERSION:-${GITHUB_REF_NAME}}\"|" instalar/axioma-instalar.sh
          sed -i "s|^VERSION_DEFECTO = os.environ.get(\"AXIOMA_VERSION\", \"main\")|VERSION_DEFECTO = os.environ.get(\"AXIOMA_VERSION\", \"${GITHUB_REF_NAME}\")|" instalar/axioma_setup.py
          sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g" instalar/axioma-instalar.sh instalar/axioma_setup.py
          for archivo in instalar/axioma-instalar.sh instalar/axioma_setup.py; do
            grep -q "${GITHUB_REF_NAME}" "$archivo" || { echo "no se fijo la version en $archivo"; exit 1; }
            grep -q "${GITHUB_REPOSITORY}" "$archivo" || { echo "no se fijo el repositorio en $archivo"; exit 1; }
            if grep -q "__REPO__" "$archivo"; then echo "quedo un __REPO__ sin reemplazar en $archivo"; exit 1; fi
          done
          grep -n "AXIOMA_VERSION:-" instalar/axioma-instalar.sh

      # PyInstaller es una HERRAMIENTA DE EMPAQUETADO, no una dependencia del producto: por eso no
      # está en `requirements-ci.txt` (se sacó a propósito el 2026-10-12) y se instala acá.
      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Construir AXIOMA-Setup.exe
        run: pyinstaller --onefile --console --name AXIOMA-Setup instalar/axioma_setup.py

      # Que el .exe ARRANQUE es lo único que PyInstaller puede romper (faltó un módulo, un dato…).
      # `--help` sale 0 siempre; `--dry-run` puede salir 4 si el runner no tiene Docker andando, y
      # las dos son respuestas correctas: lo que no puede pasar es que no arranque.
      # ⚠️ 2026-10-28 (MEDIDO en este repo): el paso imprimía el OK pero GitHub lo marcaba ROJO
      # cuando `--dry-run` devolvía 4, porque GitHub cierra el paso con el ÚLTIMO `$LASTEXITCODE`
      # (Docker instalado pero sin responder ⇒ 4 ⇒ "Process completed with exit code"). Se guarda el
      # código, se valida 0 o 4 y se sale con `exit 0` EXPLÍCITO.
      - name: Verificar que el .exe arranca
        shell: pwsh
        run: |
          .\dist\AXIOMA-Setup.exe --help
          if ($LASTEXITCODE -ne 0) { throw "el .exe no arranca (--help salio $LASTEXITCODE)" }
          .\dist\AXIOMA-Setup.exe --dry-run
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0 -and $codigo -ne 4) { throw "salida inesperada: $codigo" }
          Write-Host "OK: el .exe arranca y explica lo que haria (dry-run salio $codigo; 0 y 4 son validos)"
          exit 0

      - name: Publicar el Release con los dos instaladores
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTAS="Instaladores de AXIOMA de un solo archivo: se descargan y se ejecutan, sin clonar el repositorio.

          - **Windows**: descargá \`AXIOMA-Setup.exe\` y hacé **doble clic** (necesitás Docker Desktop).
          - **Linux**: descargá \`axioma-instalar.sh\` y corré \`bash axioma-instalar.sh\` (necesitás Docker).

          El instalador comprueba Docker, descarga AXIOMA, crea las carpetas y tu \`.env\`, arma la imagen, deja el acceso directo y lo enciende."
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "AXIOMA $TAG" --notes "$NOTAS"
          gh release upload "$TAG" \
            "dist/AXIOMA-Setup.exe" \
            "instalar/axioma-instalar.sh" \
            --clobber
          echo "### Release $TAG publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
